name: Release

# Tag a commit on master to cut a release:
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags:
      - 'v*'

jobs:
  # the tag is the release version, so the manifest should say the same thing
  # rather than the commit count used for dev builds
  version:
    runs-on: ubuntu-latest
    outputs:
      manifest_version: ${{ steps.strip.outputs.manifest_version }}
    steps:
      - id: strip
        env:
          TAG: ${{ github.ref_name }}
        run: echo "manifest_version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/make-dapp.yaml
    with:
      manifest_version: ${{ needs.version.outputs.manifest_version }}

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download .dapp
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.dapp_name }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DAPP: ${{ needs.build.outputs.dapp_name }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" "$DAPP" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            --notes "Manifest version \`$VERSION\`. Install \`$DAPP\` from the Beam wallet."
