name: Release

# The manifest version is <prefix>.<commit count>, same as dex-app. Tag the
# commit with that version to cut a release:
#   git tag "v1.1.$(git rev-list --count HEAD)" && git push origin --tags
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: ./.github/workflows/make-dapp.yaml

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # notes are built from the log since the previous tag
          fetch-depth: 0

      - name: Download .dapp
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.dapp_name }}

      # --generate-notes only lists merged PRs, and this repo releases straight
      # off master, so it produced an empty changelog.
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          DAPP: ${{ needs.build.outputs.dapp_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PREV=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          {
            echo "Manifest version \`${VERSION}\`. Install \`${DAPP}\` from the wallet's Applications tab."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --format='- %s' "${PREV}..${TAG}"
              echo
              echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${PREV}...${TAG}"
            else
              git log --no-merges --format='- %s' -20 "${TAG}"
            fi
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DAPP: ${{ needs.build.outputs.dapp_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" "$DAPP" \
            --repo "$REPO" \
            --title "$TAG" \
            --notes-file notes.md
